<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDR CRM Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #181825;
      color: #cdd6f4;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #313244;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background-color: #11111b;
      border: 1px solid #313244;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #ef4444;
    }
    .dot.online {
      background-color: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }
    .stats-card {
      margin-top: 12px;
      background-color: #24273a;
      border: 1px solid #363a4f;
      border-radius: 8px;
      padding: 12px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background-color: #181825;
      border: 1px solid #313244;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
      font-family: monospace;
    }
    .stat-lbl {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .api-url {
      margin-top: 12px;
      background-color: #11111b;
      border: 1px solid #313244;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 11px;
      color: #a6adc8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease;
    }
    .btn-test {
      background-color: #4f46e5;
      color: #ffffff;
    }
    .btn-test:hover {
      background-color: #4338ca;
    }
    .btn-refresh {
      background-color: #313244;
      color: #cdd6f4;
      margin-top: 6px;
    }
    .btn-refresh:hover {
      background-color: #45475a;
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #6c7086;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⚡</span>
      <span>SDR CRM Bridge</span>
    </div>
    <div class="status-badge" id="bridge-status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Checking...</span>
    </div>
  </div>

  <div class="stats-card">
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-val" id="val-dials">--</div>
        <div class="stat-lbl">Today's Dials</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="val-transfers" style="color: #4ade80;">--</div>
        <div class="stat-lbl">Live Transfers</div>
      </div>
    </div>
  </div>

  <div class="api-url">
    <span>Endpoint:</span>
    <span style="color: #38bdf8;">POST /api/log_call</span>
  </div>

  <button class="btn btn-test" id="btn-test-call">
    📞 Send Test Call to Desktop CRM
  </button>
  <button class="btn btn-refresh" id="btn-refresh">
    🔄 Ping Desktop Server (8000)
  </button>

  <div class="footer">
    Injected on Web Dialers (Outreach, Salesloft, Dialpad, etc.)
  </div>

  <script src="popup.js"></script>
</body>
</html>
